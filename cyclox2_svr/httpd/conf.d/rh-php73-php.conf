# イメージ同梱の rh-php73-php.conf を上書きする。PHP2Shell 暫定対策 2026-10 で php_value を無効化した
# （リクエスト単位の ini 設定は CVE-2026-109619 の経路になるため。値は php/99-php2shell.ini へ移設）
#
# The following lines prevent .user.ini files from being viewed by Web clients.
#
<Files ".user.ini">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
        Satisfy All
    </IfModule>
</Files>

#
# Allow php to handle Multiviews
#
AddType text/html .php

#
# Add index.php to the list of files that will be served as directory
# indexes.
#
DirectoryIndex index.php

# mod_php options
<IfModule  mod_php7.c>
    #
    # Cause the PHP interpreter to handle files with a .php extension.
    #
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    #
    # Uncomment the following lines to allow PHP to pretty-print .phps
    # files as PHP source code:
    #
    #<FilesMatch \.phps$>
    #    SetHandler application/x-httpd-php-source
    #</FilesMatch>

    #
    # Apache specific PHP configuration options
    # those can be override in each configured vhost
    #
    #php_value soap.wsdl_cache_dir  "/var/opt/rh/rh-php73/lib/php/wsdlcache"

    #php_value opcache.file_cache   "/var/opt/rh/rh-php73/lib/php/opcache"
</IfModule>
