; PHP2Shell (CVE-2026-109618/109619) 暫定対策 2026-10（ローカル用。本番の内容は
; .kiro/specs/php2shell-mitigation-2026-10/runbook.md の 2. を参照）
; 恒久対応(PHP更新)後に memory_limit を有限値へ戻すこと
; 適用前の memory_limit = 128M
memory_limit = -1
post_max_size = 8M
upload_max_filesize = 2M
session.upload_progress.enabled = 0
; httpd/conf.d/rh-php73-php.conf の php_value から移設（値は同一）
soap.wsdl_cache_dir = "/var/opt/rh/rh-php73/lib/php/wsdlcache"
